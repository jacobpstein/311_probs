name: Refresh map data
# Pulls a rolling two-year window of NYC 311 data, refits the model, validates the
# export, and - only if every check passes - commits the new web/data and redeploys
# the map. Runs weekly; can also be triggered by hand from the Actions tab.
on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed data
  actions: write    # dispatch the Pages deploy

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch (rolling two-year window ending 31 days ago)
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}   # optional
        run: python pipeline/fetch_311.py

      - name: Clean, assign tracts, bin durations
        run: python pipeline/prepare.py

      - name: Fit model and export
        run: python pipeline/export_web.py

      - name: Validate export (blocks publishing on failure)
        run: python pipeline/validate_export.py

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data data/funnel.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            THROUGH=$(python -c "import json;print(json.load(open('web/data/meta.json'))['model']['data_through'])")
            git commit -m "Refresh map data through ${THROUGH}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the workflow token do not trigger other workflows,
      # so dispatch the Pages deploy explicitly.
      - name: Redeploy map
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
